
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitSphere Gym Equipment Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f3faf5;
    color: #064e3b;
}

.container {
    max-width: 1450px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 35px;
    align-items: center;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 35px;
    color: #065f46;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 10px #00000015;
}

.card img {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card p {
    margin: 0;
    padding: 12px 5px;
    text-align: center;
    color: white;
    background: #047857;
    font-weight: bold;
    font-size: 15px;
}

/* Mobile Phone Preview */

.phone {
    width: 280px;
    padding: 12px;
    border: 8px solid #202020;
    border-radius: 40px;
    background: white;
    box-shadow: 0 8px 20px #00000025;
}

.screen {
    border-radius: 25px;
    overflow: hidden;
    padding: 12px 5px;
    background: white;
}

.phone h2 {
    text-align: center;
    font-size: 18px;
    margin: 15px 0 20px;
    color: #065f46;
}

.mobile-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.mobile-gallery .card img {
    height: 90px;
}

.mobile-gallery .card p {
    font-size: 10px;
    padding: 8px 2px;
}

/* Responsive Layout */

@media (max-width: 1000px) {
    .container {
        grid-template-columns: 1fr;
    }

    .phone {
        margin: 25px auto;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 24px;
    }

    .gallery {
        gap: 12px;
    }

    .card img {
        height: 120px;
    }

    .card p {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Desktop Gallery -->

    <div class="main-content">

        <h1>FITSPHERE GYM EQUIPMENT GALLERY</h1>

        <div class="gallery">
